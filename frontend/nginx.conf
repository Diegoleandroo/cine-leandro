server {
    listen 80;
    root /usr/share/nginx/html;

    # Não mostra a versão do nginx nas respostas (menos pista para quem procura falhas)
    server_tokens off;

    # ---------------------------------------------------------------- segurança
    # Valem para todas as respostas (o "always" inclui as de erro).
    # CSP: o navegador só carrega o que vem daqui, pôsteres do TMDB e trailers do YouTube.
    # Bloqueia scripts injetados por terceiros (XSS), que poderiam roubar o login.
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://image.tmdb.org; font-src 'self'; connect-src 'self'; frame-src https://www.youtube-nocookie.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";
    add_header Content-Security-Policy $csp always;
    # Ninguém pode colocar o Cine Leandro escondido dentro de outro site (clickjacking)
    add_header X-Frame-Options "DENY" always;
    # O navegador não tenta "adivinhar" o tipo de arquivo
    add_header X-Content-Type-Options "nosniff" always;
    # Ao clicar num link externo, não envia o endereço completo da página
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Câmera, microfone e localização: o site não usa, então ficam desligados
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # /api vai para o Django (mesmo papel do CloudFront na AWS)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # IP real do visitante: o Django usa no limite de tentativas por IP
        proxy_set_header X-Forwarded-For $remote_addr;
        # O Django já manda estes cabeçalhos; escondemos os dele para não ir repetido
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
    }

    # Arquivos do build (JS/CSS) têm o "hash" no nome: cada versão nova ganha um nome novo,
    # então podem ficar em cache por 1 ano sem risco de ficarem velhos.
    # (No nginx, um add_header dentro do location substitui os de cima: por isso repetimos.)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy $csp always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # O index.html é a "porta de entrada": o navegador SEMPRE confere se mudou.
    # Sem isso, depois de uma atualização, o navegador podia mostrar a versão antiga até o F5.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Content-Security-Policy $csp always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}
